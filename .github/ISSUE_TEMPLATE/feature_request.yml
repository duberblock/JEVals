name: Feature request
description: Propose a new capability, provider, or protocol support.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For large changes (new providers, protocol moves, breaking API
        changes) this issue is the alignment step — describe the problem and
        the outcome, not the implementation, and we will discuss the
        approach before any code.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The workflow or question that is awkward or impossible today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: The outcome you want, in one or two sentences.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Providers (emulator / JEV / Judge / Independent)
        - Execution modes & comparison
        - Principal
        - Investigation
        - Operation
        - Settings & configuration
        - Deployment / operations
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Configurations or workarounds you already tried.
    validations:
      required: false
