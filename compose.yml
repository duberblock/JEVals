# Standard self-hosted stack: builds both apps from the local source tree.
#   docker compose up --build
#     web  → http://localhost:3000  (Next.js; proxies /api/v1 to the API and
#                                  injects the Basic Auth credentials itself)
#     api  → http://localhost:8000  (FastAPI; answers 401 without credentials,
#                                  /health and /ready stay open)
# The API applies database migrations before serving. SQLite data persists in
# the ./data bind mount — back that directory up.
#
# Credentials default to playground/playground for local tries; override with
# AUTH_USER/AUTH_PASS (env vars or a .env file next to this compose). Provider
# settings (EMULATOR_URL, TYPESAFE_API_KEY, OPENAI_API_KEY, …) pass through from the
# same environment when set — see .env.example for the full list.
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    # Migrations run on every boot (alembic upgrade head is idempotent on an
    # up-to-date schema) before the API serves traffic.
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: sqlite:////data/jevals.db
      # Fail closed: with AUTH_REQUIRED=true the API rejects every
      # non-public path unless credentials are configured.
      AUTH_REQUIRED: "true"
      AUTH_USER: ${AUTH_USER:-playground}
      AUTH_PASS: ${AUTH_PASS:-playground}
      EMULATOR_URL: ${EMULATOR_URL:-}
      EMULATOR_API_KEY: ${EMULATOR_API_KEY:-}
      EMULATOR_MODEL: ${EMULATOR_MODEL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_STRUCTURED_OUTPUTS: ${OPENAI_STRUCTURED_OUTPUTS:-true}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      INDEPENDENT_API_KEY: ${INDEPENDENT_API_KEY:-}
      INDEPENDENT_BASE_URL: ${INDEPENDENT_BASE_URL:-}
      INDEPENDENT_MODEL: ${INDEPENDENT_MODEL:-}
      # Master key for credentials saved through the settings UI (unset: a
      # 0600 settings.key file beside the database is generated on first use).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.error, urllib.request\ntry:\n    urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)\n    raise SystemExit(1)\nexcept urllib.error.HTTPError as exc:\n    raise SystemExit(0 if exc.code == 401 else 1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Server-side proxy contract: the web forwards /api/v1 to this URL and
      # injects the Basic Auth credentials configured here itself.
      API_BASE_URL: http://api:8000
      AUTH_USER: ${AUTH_USER:-playground}
      AUTH_PASS: ${AUTH_PASS:-playground}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
